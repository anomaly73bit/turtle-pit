name: Robot Turtle giornaliero

on:
  schedule:
    - cron: "15 6-21 * * 1-5"  # ogni ora a mercati aperti (ora UTC): seduta in corso, provvisoria
    - cron: "30 22 * * 1-5"    # dopo la chiusura dei mercati USA: seduta definitiva
  workflow_dispatch:           # avvio manuale dal tab Actions

permissions:
  contents: write

concurrency:
  group: turtle
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python turtle_live.py
      - name: Salva portafoglio e dashboard
        run: |
          git config user.name "turtle-robot"
          git config user.email "turtle-robot@users.noreply.github.com"
          git add state.json docs/index.html
          git diff --cached --quiet || git commit -m "Robot: aggiornamento $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -q origin main || true
          git push
