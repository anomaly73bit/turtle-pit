name: Test fonti tennis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Quote Unibet (Kambi) e fonti storiche
        run: |
          python3 - <<'PY' | tee test_fonti.txt
          import json, urllib.request
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
               "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8", "Accept-Language": "en-GB,en;q=0.9",
               "Referer": "http://www.tennis-data.co.uk/alldata.php"}
          def get(u, h=H):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers=h), timeout=30); b = r.read(); return r.status, b
              except Exception as e:
                  return getattr(e, "code", "ERR"), str(e).encode()
          for u in ["http://www.tennis-data.co.uk/alldata.php", "http://www.tennis-data.co.uk/2026/2026.xlsx", "http://www.tennis-data.co.uk/2026w/2026.xlsx",
                    "http://www.tennis-data.co.uk/2025/2025.xlsx", "https://www.tennis-data.co.uk/2026/2026.xlsx",
                    "https://site.api.espn.com/apis/site/v2/sports/tennis/atp/scoreboard",
                    "https://site.api.espn.com/apis/site/v2/sports/tennis/wta/scoreboard",
                    "https://api.sofascore.com/api/v1/sport/tennis/scheduled-events/2026-10-19",
                    "https://huggingface.co/datasets/Aneeshers/tennis-sackmann-archive/tree/main",
                    "https://stats.tennismylife.org/tennis-match-database",
                    "https://raw.githubusercontent.com/Tennismylife/TML-Database/master/ongoing_tourneys.csv"]:
              s, b = get(u); print(u, s, len(b), b[:160])
          PY
      - name: Salva risultato
        run: |
          git config user.name "turtle-robot"
          git config user.email "turtle-robot@users.noreply.github.com"
          git add test_fonti.txt && git commit -m "Risultato test fonti tennis" && git push
